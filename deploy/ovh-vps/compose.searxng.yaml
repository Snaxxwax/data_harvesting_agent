# SearXNG discovery search. OPT-IN: this file is not loaded unless COMPOSE_FILE names it.
#
#   HARVEST_SEARCH_URL=http://searxng:8080
#
# Harvest's `search` task already speaks SearXNG's JSON API, so this file is what turns
# discovery on. Two properties have to hold simultaneously, and they pull in opposite
# directions:
#
#   * the Harvest worker must REACH it -- the worker is confined to `harvest-egress`, an
#     internal network with no gateway, so a service it can reach has to be ON that network.
#     This is the same reason sf-api is attached there.
#   * its engine queries must LEAVE through the relay -- otherwise the searches are
#     attributable to this VPS's address while every other request in the deployment goes
#     through the upstream proxy. `outgoing.proxies` in settings.yml does that, and the
#     `default` network below is how it reaches the relay to do it.
#
# Nothing is published. There is no reason for anything outside Docker to query it, and a
# published SearXNG on a public address is an open relay for other people's searches.
services:
  searxng:
    # Pinned by digest, not :latest. This host runs Watchtower, and the instance this
    # mirrors on the workstation is on :latest -- a nightly bump of a search backend is
    # how discovery silently changes shape. Digest is version 2026.10.2-19ffbcd30, the
    # exact image already in service there.
    image: searxng/searxng@sha256:c642712fcedcdaa78fac44f71eada86aff510745826ba1bd1a368211fea2ce7f
    container_name: harvest-searxng
    restart: unless-stopped
    init: true
    # harvest-egress: where the Harvest worker reaches it, by container name.
    # default: how it reaches egress-relay for its own outbound engine queries.
    networks: [harvest-egress, default]
    volumes:
      - /opt/harvest/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Signs SearXNG's own URLs. Not a third-party credential and not shared with anything,
      # so unlike the proxy upstream it is an env var rather than a mounted 0600 file --
      # leaking it lets someone forge a search URL on an instance nobody else can reach.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env}
      SEARXNG_BASE_URL: http://searxng:8080/
      # uwsgi defaults to a worker per core and this box has other jobs to run.
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "4"
    # It holds no state worth keeping: a restart re-reads settings.yml and that is all.
    read_only: true
    tmpfs:
      - /var/cache/searxng:mode=0700
      - /run:mode=0700
      # read_only leaves no writable /tmp, and granian's worker aborts at startup with
      # "No usable temporary directory found" before serving a single request.
      - /tmp:mode=1777
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      # Probes the JSON format specifically, because that is the only thing Harvest uses and
      # the one most likely to be misconfigured -- `formats` omitting json answers 403 here
      # while the HTML UI keeps working perfectly.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request,json;
          d=json.load(urllib.request.urlopen('http://localhost:8080/search?q=ping&format=json',timeout=8));
          raise SystemExit(0 if 'results' in d else 1)"
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

networks:
  # Declared external, matching compose.egress-proxy.yaml which owns it. Unlike SpiderFoot
  # -- a core service that must start even when proxy mode is off -- this service exists
  # only to serve the confined worker, so refusing to start without that network is correct.
  harvest-egress:
    name: harvest-egress
    external: true
