# Egress relay for proxy-only mode. Listens on the internal harvest-egress
# network, where the worker has no route of its own, and forwards everything to
# the upstream ISP proxy. Replace the Upstream line with the Webshare endpoint.
#
# The worker cannot reach the internet except through this process, so
# "proxy-only" is a property of the Docker routing, not of a firewall rule
# somebody has to remember to load.
User nobody
Group nogroup
Port 8888
Timeout 600
# Only the internal network can reach this; it is not published anywhere.
Allow 0.0.0.0/0
ConnectPort 443
ConnectPort 80
LogLevel Info
DisableViaHeader Yes

# ---- Upstream (Webshare US static ISP) ----------------------------------
# Syntax: Upstream http user:password@host:port
# With no Upstream line the relay egresses from this VPS directly, which is
# useful only for testing the plumbing -- it is NOT a privacy boundary.
# PLACEHOLDER -- replace host/port/credentials with the Webshare endpoint, then
# `docker restart harvest-egress-relay`. Verified working against a credentialed
# upstream proxy on 2026-10-02; only this line changes for the real one.
#Upstream http USER:PASSWORD@p.webshare.io:80
