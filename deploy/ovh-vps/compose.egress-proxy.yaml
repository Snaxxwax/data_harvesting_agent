# Proxy-only egress. OPT-IN: this file is not loaded unless you name it.
#
#   docker compose -f compose.yaml -f compose.override.yaml \
#                  -f compose.egress-proxy.yaml up -d
#
# Why a relay instead of firewall rules: the worker joins only `harvest-egress`,
# which is an internal Docker network with no gateway, so it has no route to the
# internet at all. The single way out is the relay, which chains to the upstream
# ISP proxy. A forgotten iptables rule silently restores direct egress; a missing
# route cannot. Harvest additionally probes HARVEST_EGRESS_PROBE and refuses to
# run Maigret if direct egress turns out to work, so a misconfiguration fails
# closed instead of quietly leaking.
#
# Note the limit of that probe: it proves the WORKER has no route of its own, not
# that the RELAY actually chains to an upstream. tinyproxy with no `Upstream` line
# runs fine and connects directly from this VPS's address, so entrypoint.sh
# refuses to start without the credential, and verify-deployment.sh asserts the
# running config has an Upstream line.
services:
  egress-relay:
    image: vimagick/tinyproxy
    container_name: harvest-egress-relay
    restart: unless-stopped
    init: true
    # The upstream credential is NOT here, and not in `environment` either: an env var is
    # readable from `docker inspect`, `docker compose config` and /proc/1/environ, which
    # would only move a world-readable secret from one place to another. It arrives as a
    # 0600 bind-mounted file that entrypoint.sh reads, and the assembled config is written
    # to the tmpfs below so the only at-rest copy inside the container never touches disk.
    entrypoint: ["/usr/local/bin/egress-entrypoint.sh"]
    environment:
      # The deployment-wide outbound connection limit, enforced here as MaxClients. The
      # worker and api read the same variable, so set it once in .env, never per service.
      HARVEST_EGRESS_MAX_CONNECTIONS: ${HARVEST_EGRESS_MAX_CONNECTIONS:-128}
    volumes:
      - /opt/harvest/egress-relay/tinyproxy.conf.template:/etc/tinyproxy/tinyproxy.conf.template:ro
      - /opt/harvest/egress-relay/entrypoint.sh:/usr/local/bin/egress-entrypoint.sh:ro
      # 0600 root-owned on the host. Keep it OUT of /opt/harvest/app (the git repo).
      - /opt/harvest/egress-relay/upstream.secret:/run/secrets/egress-upstream:ro
    tmpfs:
      - /run/tinyproxy:mode=0700
    # harvest-egress: where the worker reaches it. default: how it reaches the
    # upstream proxy. Nothing is published; it is not reachable from outside.
    networks: [harvest-egress, default]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  worker:
    # !override replaces the list from compose.override.yaml rather than merging,
    # which is the whole point: the worker must NOT keep an internet-capable
    # network. sf-api joins harvest-egress (see spiderfoot-ng/compose.core.yml)
    # so SpiderFoot stays reachable.
    networks: !override [harvest-egress]
    environment:
      HARVEST_EGRESS_MODE: proxy
      HARVEST_EGRESS_PROXY: http://egress-relay:8888
      HARVEST_EGRESS_MAX_CONNECTIONS: ${HARVEST_EGRESS_MAX_CONNECTIONS:-128}
      # Must be unreachable without the proxy. If this connects, tools refuse to run.
      HARVEST_EGRESS_PROBE: ${HARVEST_EGRESS_PROBE:-1.1.1.1:443}
      # OPTIONAL extra restriction, empty by default. When set, the fetcher allows
      # only these exact hostnames (no wildcards, no subdomain matching). When empty,
      # the job's own allowed_domains plus require_public_host() are the policy, so
      # leads discovered mid-job are crawlable without enumerating hosts in advance.
      # Setting it to a non-empty list is what the old "deny everything unlisted"
      # behaviour now requires.
      HARVEST_PROXY_PUBLIC_HOSTS: ${HARVEST_PROXY_PUBLIC_HOSTS:-}

  # The API serves requests and does not run tools, but it shares the job store
  # and must agree about the mode so a job cannot be planned as direct.
  api:
    environment:
      HARVEST_EGRESS_MODE: proxy
      HARVEST_EGRESS_PROXY: http://egress-relay:8888
      HARVEST_EGRESS_MAX_CONNECTIONS: ${HARVEST_EGRESS_MAX_CONNECTIONS:-128}
      # Must match the worker's value: the api plans jobs and has to agree about policy.
      HARVEST_PROXY_PUBLIC_HOSTS: ${HARVEST_PROXY_PUBLIC_HOSTS:-}

networks:
  # Owned by this file, so it exists exactly when proxy-only mode is in use.
  # `internal: true` IS the enforcement: no gateway, hence no route off-host.
  # Nothing else declares it as a dependency -- SpiderFoot deliberately does not,
  # so a missing network can never stop that core service from starting. sf-api is
  # attached at enable time with `docker network connect harvest-egress sf-api`.
  harvest-egress:
    name: harvest-egress
    internal: true
