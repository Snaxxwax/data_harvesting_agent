# Minimal core only: redis, postgres, api, celery-worker, frontend.
# The optional storage / ai / monitor / scan / sso / scheduler / proxy stacks
# from the upstream docker-compose.yml are deliberately NOT included.
name: spiderfoot-ng
include:
  - docker/compose/core.yml

services:
  # Published on the Tailscale address only. Docker's DOCKER-USER iptables rules
  # bypass ufw, so the interface-bound publish is the real access control.
  frontend:
    ports: !override
      - "100.118.181.47:3000:80"
  api:
    ports:
      - "100.118.181.47:8001:8001"
    # Production Harvest always uses the shared egress network, declared below as
    # external. Compose owns the attachment so recreating sf-api cannot silently drop
    # the worker-to-API path.
    networks: [default, osint-net, harvest-egress]
    environment:
      # core.yml does not pass this through. Without it the API key manager
      # generates a RANDOM HMAC secret per process and cannot persist it (the
      # filesystem is read-only), so a minted key dies on restart and the two
      # uvicorn workers disagree about whether any key is valid.
      SF_API_KEY_SECRET: ${SF_API_KEY_SECRET:?SF_API_KEY_SECRET must be set in .env}
    # core.yml probes /api/docs, which does not touch Postgres at all. /health
    # reports per-component status, so assert Postgres is genuinely reachable.
    #
    # Note what this probe does NOT catch: /health opens its own connection,
    # while AuthService caches a separate one. A stale auth connection therefore
    # left /health reporting postgresql "up" while every authenticated call
    # answered 401. That is fixed in code (AuthService._get_conn pre-pings and
    # reconnects, see the fix/auth-db-reconnect patch), not by this healthcheck
    # -- no HTTP probe can observe another component's private connection.
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8001/health',timeout=8)); raise SystemExit(0 if d['components']['postgresql']['status']=='up' else 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  # Upstream's probe is `celery -A spiderfoot.celery_app:celery_app inspect ping
  # --timeout 5`. Importing spiderfoot.celery_app in a cold process costs ~5.0s
  # here, and `inspect ping` always waits out the full reply window rather than
  # returning on the first pong, so the probe needs ~10.1s against Docker's 10s
  # timeout: it was killed every time and the worker sat "unhealthy" with a
  # failing streak of 30 while answering "pong" perfectly.
  #
  # -b/--broker pings over the broker directly and skips the spiderfoot import
  # entirely, which is the whole 5s. Measured on this host: ~4.4s when the worker
  # is up (exit 0), ~4.3s with no worker and ~8.5s with the broker unreachable
  # (exit 69 in both cases) -- so it still reports unhealthy for the real
  # failures, which is the point of keeping a probe at all.
  celery-worker:
    # Confined: sf-backend (postgres/redis, internal) and sf-dns (internal) only, plus
    # harvest-egress attached at enable time. core.yml also put it on sf-frontend, a normal
    # bridge, which let any code path that ignores HTTP(S)_PROXY -- a raw socket, a library
    # with trust_env off -- connect straight out from this VPS (measured 2026-10-06:
    # socket.connect(('1.1.1.1', 443)) succeeded). Now HTTP leaves via the relay, DNS via
    # sf-dns, and nothing else leaves at all; verify-deployment.sh lists each allowlisted
    # module's transports and fails on one that needs anything else.
    networks: !override [sf-backend, sf-dns, harvest-egress]
    dns: [172.31.253.2]
    # THIS is what actually proxies SpiderFoot's scans. Its modules use `requests`, which
    # honours HTTP(S)_PROXY, and measured from inside this container the exit IP becomes the
    # upstream proxy's instead of this VPS's.
    #
    # SpiderFoot's OWN global proxy (`_socks1type`/`_socks2addr`/`_socks3port`) does not
    # work here and must not be relied on. Measured on NG 6.1.0:
    #   * `save_config()` persists those keys to Postgres -- the rows exist -- but nothing
    #     reloads them at startup, so `GET /api/v1/config` always answers with the hardcoded
    #     "" default; and with two uvicorn workers a read right after a PATCH is served by
    #     whichever worker gets it, so the same value read twice disagreed.
    #   * the scanner ignores them regardless: a scan whose modules reached their targets
    #     moved 0 bytes through the relay, i.e. it egressed directly.
    # Harvest therefore stopped asserting against that API (it had been denying every
    # spiderfoot run since proxy mode was enabled) and reads HARVEST_SPIDERFOOT_EGRESS
    # instead, which declares exactly this block. verify-deployment.sh checks it for real.
    #
    # Requires `docker network connect harvest-egress sf-celery-worker`, as sf-api does --
    # without it `egress-relay` does not resolve and every module request fails. That is
    # fail-closed and deliberate: for an attribution-control tool, no scan beats a scan that
    # silently leaves from this host. The attachment survives a restart, not a recreate.
    environment:
      HTTP_PROXY: http://egress-relay:8888
      HTTPS_PROXY: http://egress-relay:8888
      # Internal service traffic must NOT go through the relay: the relay has a blanket
      # upstream, so a proxied request to postgres/redis would be sent to Webshare. Names
      # and the Docker DNS resolver are both listed because requests matches on hostname.
      NO_PROXY: localhost,127.0.0.1,postgres,redis,sf-postgres,sf-redis,api,sf-api,searxng,.local
      # One scan per celery child process. A child that ran a long scan kept its Postgres
      # pool checked out (2026-10-04: an 81-minute scan, 501 "connection pool exhausted"),
      # and the NEXT scan given to that child died in 0.1s without ever starting -- Harvest
      # then waited out its whole timeout. A fresh child per scan releases the pool.
      SF_CELERY_MAX_TASKS_PER_CHILD: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -b \"$$SF_REDIS_URL\" inspect ping --timeout 2"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  # The approved DNS resolver for the confined scanner; see sf-dns/Corefile.
  sf-dns:
    # Pinned by digest: this host runs Watchtower. Tag 1.12.4.
    image: coredns/coredns@sha256:986f04c2e15e147d00bdd51e8c51bcef3644b13ff806be7d2ff1b261d6dfbae1
    container_name: sf-dns
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - /opt/harvest/sf-dns/Corefile:/etc/coredns/Corefile:ro
    networks:
      # default: its own upstream. sf-dns: where the scanner reaches it, at a fixed address
      # because `dns:` takes an IP, not a name.
      default: {}
      sf-dns:
        ipv4_address: 172.31.253.2
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # core.yml leaves these unbounded, so on a shared host they would inherit all
  # 11 GiB. Capped well above observed steady state (postgres ~65M, redis ~5M).
  postgres:
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768M}
  redis:
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

networks:
  osint-net:
    external: true
  harvest-egress:
    name: harvest-egress
    external: true
  sf-dns:
    name: sf-dns
    internal: true
    ipam:
      config:
        - subnet: 172.31.253.0/29
